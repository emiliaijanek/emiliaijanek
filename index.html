<!DOCTYPE html>

<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kochana Emilciu ❤️</title>



<style>

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}



body{

    height:100vh;

    overflow:hidden;

    font-family:Arial,sans-serif;

    color:white;

}



.background{

    position:fixed;

    width:100%;

    height:100%;

    background:

    linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),

    url("EMILKUMILKU.jpg");

    background-size:cover;

    background-position:center;

    z-index:-2;

}



.container{

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:20px;

}



.card{

    background:rgba(0,0,0,.35);

    backdrop-filter:blur(8px);

    padding:30px;

    border-radius:25px;

    max-width:800px;

}



.heart{

    font-size:80px;

    animation:beat 1s infinite;

}



@keyframes beat{

    0%{transform:scale(1);}

    50%{transform:scale(1.2);}

    100%{transform:scale(1);}

}



h1{

    margin:15px 0;

}



.message{

    margin-top:15px;

    line-height:1.8;

    font-size:18px;

}



.counter{

    margin-top:25px;

    font-size:28px;

    font-weight:bold;

}



.time{

    margin-top:15px;

    font-size:22px;

}



.falling-heart{

    position:fixed;

    top:-50px;

    animation:fall linear forwards;

}



@keyframes fall{

    to{

        transform:translateY(110vh);

    }

}

</style>

</head>

<body>



<div class="background"></div>



<div class="container">

    <div class="card">



        <div class="heart">❤️</div>



        <h1>Kochana Emilciu❤️</h1>



        <div class="message">

            Emilku,<br><br>



            Dziękuję Ci za każdy wspólny moment,

            za Twój uśmiech,za to,że jesteś i

            za to,że zawsze mnie wspierasz,



            nie wiem co ja bym bez ciebie zrobił,

            Kocham cię najbardziej na świecie,i z każdym

            dniem coraz mocniej



             - Janek❤️

        </div>



        <div class="counter" id="days"></div>



        <div class="time" id="time"></div>



    </div>

</div>



<script>



const startDate = new Date("2025-08-01T00:00:00");



function updateCounter(){



    const now = new Date();



    const diff = now - startDate;



    const days = Math.floor(diff / (1000*60*60*24));



    const hours = Math.floor(

        (diff % (1000*60*60*24))

        /(1000*60*60)

    );



    const minutes = Math.floor(

        (diff % (1000*60*60))

        /(1000*60)

    );



    document.getElementById("days").innerHTML =

    `Razem już ${days} dni ❤️`;



    document.getElementById("time").innerHTML =

    `${hours} godzin i ${minutes} minut`;

}



setInterval(updateCounter,1000);

updateCounter();



function createHeart(){



    const heart = document.createElement("div");



    heart.innerHTML="❤️";



    heart.classList.add("falling-heart");



    heart.style.left=Math.random()*100+"vw";



    heart.style.fontSize=

        (15+Math.random()*25)+"px";



    heart.style.animationDuration=

        (4+Math.random()*4)+"s";



    document.body.appendChild(heart);



    setTimeout(()=>{

        heart.remove();

    },8000);

}



setInterval(createHeart,300);



</script>



</script>





    

</body>

</html>
